# The public mirror's CI workflow. This file is a TEMPLATE, not the live
# workflow: `scripts/sync-public.sh` preserves the mirror's `.github/` untouched
# so a re-sync cannot delete its CI. Editing this file alone therefore changes
# nothing on the public repo - copy it to
# `<mirror-checkout>/.github/workflows/ci.yml` and push, or the edit is inert.
name: CI
# Triggers mirror the canonical workflow (QUO-195): stacked PRs get CI
# against their real base, a base retarget starts a run, and a run can be
# started by hand with `gh workflow run ci.yml --ref <branch>`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, "noam/**"]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the canonical CI, the dev machine and the poll-cron image
          # (node:22-alpine).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Biome does not typecheck, and `next build` only typechecks what it
      # builds - not `*.test.ts` or `e2e/`. Runs BEFORE the build because
      # `tsconfig` includes `.next/types/**/*.ts`; a fresh checkout has no
      # `.next`, so this sees source only. (QUO-111, mirroring QUO-110.)
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          ENCRYPTION_KEY: ${{ '0000000000000000000000000000000000000000000=' }}
          POLL_SECRET: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ONLY: "true"
